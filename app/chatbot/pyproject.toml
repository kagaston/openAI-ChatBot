[project]
name = "chatbot-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.68.0",
    "python-dotenv>=1.1.0",
    "chatbot-logger",
    "chatbot-settings",
    "chatbot-errors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.uv.sources]
chatbot-logger = { workspace = true }
chatbot-settings = { workspace = true }
chatbot-errors = { workspace = true }

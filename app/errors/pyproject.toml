[project]
name = "chatbot-errors"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["chatbot-logger"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/errors"]

[tool.uv.sources]
chatbot-logger = { workspace = true }
